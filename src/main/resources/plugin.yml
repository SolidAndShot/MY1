name: LightningCrowbar
version: '${version}'
main: com.solidandshot.lightningcrowbar.LightningCrowbarPlugin
api-version: '26.2'
folia-supported: true
author: SolidAndShot
description: A configurable 10-minute hide-and-seek game for Luminol and Folia servers.

commands:
  hns:
    description: Controls the 10-minute hide-and-seek game.
    usage: /hns <admin|start|stop|randomize|setrole|test|kit|status>
    aliases: [hidenseek]
    permission: lightningcrowbar.hns

  lightningcrowbar:
    description: Gives plugin items.
    usage: /lightningcrowbar give [player] or /lightningcrowbar givebrick [player]
    aliases: [lcrowbar]
    permission: lightningcrowbar.give

permissions:
  lightningcrowbar.hns:
    description: Allows the player to control hide-and-seek games.
    default: op
  lightningcrowbar.give:
    description: Allows the player to obtain a lightning crowbar for testing.
    default: true
